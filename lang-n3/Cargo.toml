[package]
readme = "../README.md"
name = "swls-lang-n3"
description = "Notation3 (N3) language support for the Semantic Web Language Server"
keywords = ["lsp", "semantic-web", "rdf", "n3", "notation3"]
categories = ["development-tools", "parser-implementations"]
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["tokio"]
shapes = []
tokio = ["swls-core/tokio"]
agnostic = ["swls-core/agnostic"]

[dependencies]
async-trait.workspace  = true
bevy_ecs.workspace     = true
futures.workspace      = true
ropey.workspace        = true
sophia_iri.workspace   = true
tracing.workspace      = true
rowan = "0.16.1"

rdf-parsers.workspace = true
swls-lang-turtle.workspace   = true
swls-lang-rdf-base.workspace = true
swls-core = { workspace = true }
swls-lov.workspace           = true

[dev-dependencies]
test-log        = { version = "0.2.19", features = ["trace"] }
swls-test-utils = { path = "../test-utils/" }
