
[package]
readme = "../README.md"
name = "swls-core"
description = "Core LSP infrastructure for the Semantic Web Language Server"
keywords = ["lsp", "semantic-web", "rdf", "shacl", "sparql"]
categories = ["development-tools"]
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
bevy_ecs.workspace     = true
derive_more.workspace  = true
futures.workspace      = true
serde.workspace        = true
serde_json.workspace   = true
sophia_api.workspace   = true
tracing.workspace      = true
async-trait.workspace  = true
lsp-types.workspace    = true

dirs = "6"
chrono = { version = "0.4.42", default-features = false, features = ["serde"] }
swls-lov.workspace = true
rdf-parsers.workspace = true
rowan = "0.16.1"

oxigraph = { version = "0.5.3", features = ["rdf-12", "js"], default-features=false }

oxrdf = "0.3.0"

shacl_rdf = "=0.2.9"
shacl_ir = "=0.2.9"
rudof_rdf = { version= "=0.2.9", default-features = false }
shacl_ast = "=0.2.9"
prefixmap = "=0.2.9"
shacl_validation = { version = "=0.2.9", default-features = false, features = [] }
iri_s = "=0.2.9"

# Pin transitive versions of shacl_validation's sparql_service → mie to the
# =0.2.9 rudof/shacl stack (newer releases switch iri_s → rudof_iri and break
# the build). `default-features = false` is critical: their default `sparql`
# feature chains into `rudof_rdf/sparql`, which drags in tokio/reqwest/mio and
# makes the crate impossible to compile for wasm. SHACL uses only NativeEngine,
# so we never want `sparql`. Not referenced in code — version pins only
# (cargo machete is told to ignore them in [package.metadata.cargo-machete]).
sparql_service = { version = "=0.2.9", default-features = false }
mie = { version = "=0.2.9", default-features = false }

# shacl_rdf        = { path = "/home/silvius/Projects/rudof/shacl_rdf" }
# shacl_ir         = { path = "/home/silvius/Projects/rudof/shacl_ir" }
# rudof_rdf        = { path = "/home/silvius/Projects/rudof/rudof_rdf", default-features = false }
# shacl_ast        = { path = "/home/silvius/Projects/rudof/shacl_ast" }
# prefixmap        = { path = "/home/silvius/Projects/rudof/prefixmap" }
# iri_s            = { path = "/home/silvius/Projects/rudof/iri_s" }
# shacl_validation = { path = "/home/silvius/Projects/rudof/shacl_validation", default-features = false }
#

[package.metadata.cargo-machete]
# Intentionally-unused version pins (see sparql_service / mie above).
ignored = ["sparql_service", "mie"]
