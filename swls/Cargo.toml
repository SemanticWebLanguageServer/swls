[package]
readme = "../README.md"
name = "swls"
description = "Semantic Web Language Server — LSP server for Turtle, SPARQL, JSON-LD, and SHACL"
keywords = ["lsp", "semantic-web", "rdf", "sparql", "turtle"]
categories = ["development-tools", "command-line-utilities"]
version = "0.4.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
bevy_ecs.workspace     = true
futures.workspace      = true
reqwest.workspace      = true
serde_json.workspace   = true
tower-lsp = { version = "0.19.0", default-features = false }
tracing.workspace      = true

swls-lang-jsonld.workspace = true
swls-lang-sparql.workspace = true
swls-lang-turtle.workspace = true
swls-lang-trig.workspace   = true
swls-lang-n3.workspace     = true
swls-core = { workspace = true }

tokio = { version = "1.48.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["json"] }
glob = "0.3.3"

[features]
default = ["tower-lsp/runtime-tokio"]

[build-dependencies]
vergen = { version = "8", default-features = false, features = ["build"] }
