[package]
readme = "../README.md"
name = "swls-lang-trig"
description = "TriG language support for the Semantic Web Language Server"
keywords = ["lsp", "semantic-web", "rdf", "trig"]
categories = ["development-tools", "parser-implementations"]
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
bevy_ecs.workspace     = true
tracing.workspace      = true
rowan = "0.16.1"

rdf-parsers.workspace = true
swls-lang-turtle.workspace   = true
swls-lang-rdf-base.workspace = true
swls-core = { workspace = true }

[dev-dependencies]
test-log        = { version = "0.2.19", features = ["trace"] }
swls-test-utils = { path = "../test-utils/" }
