[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Arthur Vercruysse <arthur.vercruysse@outlook.com>"]
license = "MIT"
repository = "https://github.com/semanticweblanguageserver/swls"
homepage = "https://github.com/semanticweblanguageserver/swls"

[workspace.dependencies]
async-trait = "0.1.89"
lsp-types = "=0.94.1"
bevy_ecs = { version = "0.18", default-features = true, features = [
  "multi_threaded"
] }
derive_more = { version = "2", features = ["as_ref", "deref", "deref_mut", "is_variant"] }
futures = { version = "0.3.31", features = ["alloc", "executor"], default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# rdf-parsers = "0.1.8"
rdf-parsers = { version = "0.1.15" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
sophia_api = "0.9.0"
sophia_iri = "0.9.0"
sophia_turtle = "0.9.0"
tracing = "0.1"

components-rs      = { path = "components-rs",     version = "0.1.2", default-features = false }
swls-lov           = { path = "lov",               version = "0.1.2" }
swls-core          = { path = "core",              version = "0.2.0", default-features = false }
swls-lang-rdf-base = { path = "lang-rdf-base",     version = "0.2.0", default-features = false }
swls-lang-turtle   = { path = "lang-turtle",       version = "0.2.0", default-features = false }
swls-lang-jsonld   = { path = "lang-jsonld",       version = "0.2.0", default-features = false }
swls-lang-sparql   = { path = "lang-sparql",       version = "0.2.0", default-features = false }
swls-lang-trig     = { path = "lang-trig",         version = "0.2.0", default-features = false }
swls-lang-n3       = { path = "lang-n3",           version = "0.1.0", default-features = false }

[workspace]
default-members = [
  "components-rs",
  "core",
  "lov",
  "lang-rdf-base",
  "lang-turtle",
  "lang-sparql",
  "lang-trig",
  "lang-n3",
  "lang-jsonld",
  "swls",
]
members = [
  "components-rs",
  "core",
  "lov",
  "lang-rdf-base",
  "lang-turtle",
  "lang-sparql",
  "lang-trig",
  "lang-n3",
  "lang-jsonld",
  "swls",
  "test-utils",
  "conformance",
  "e2e",
]
resolver = "2"
exclude = ["turtle"]

