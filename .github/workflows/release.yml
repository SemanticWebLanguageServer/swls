name: Release LSP

permissions:
  contents: write

on:
  push:
    tags:
      - "swls-v*"  # Triggers on version tags (e.g., swls-v1.0.0)
  workflow_dispatch:  # Allows manual runs

jobs:
  build:
    uses: ./.github/workflows/build-binaries.yml
    with:
      app_version: ${{ github.ref_name }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: List downloaded files
        run: ls -R release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          # Tags like swls-v0.7.0-beta.1 are published as pre-releases, so
          # clients on the stable channel skip them.
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          body: "🚀 New release of LSP! Includes native binaries for Linux, macOS and Windows."
