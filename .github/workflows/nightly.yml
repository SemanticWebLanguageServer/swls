name: Nightly

# Rolling pre-release: every push to main rebuilds the binaries and replaces
# the assets of the single GitHub release tagged `nightly`.
#
# Editor clients on the "nightly" channel read
#   GET /repos/SemanticWebLanguageServer/swls/releases/tags/nightly
# and compare the release *name* (`nightly-<short sha>`) with the
# `version=` field of `swls --version`, which is baked in via APP_VERSION.
#
# The tag `nightly` doesn't start with `swls-v`, so clients on the stable
# channel never pick it up.
#
# Running this manually (workflow_dispatch) publishes whatever ref you pick,
# which is handy for trying a branch in your editor before merging.

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push supersedes an in-flight nightly build.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  version:
    name: Compute nightly version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.v.outputs.app_version }}
    steps:
      - id: v
        run: echo "app_version=nightly-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    uses: ./.github/workflows/build-binaries.yml
    with:
      app_version: ${{ needs.version.outputs.app_version }}

  publish:
    name: Publish nightly release
    runs-on: ubuntu-latest
    needs: [version, build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: List downloaded files
        run: ls -R release

      - name: Move the nightly tag to this commit
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly

      - name: Create or update the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          NOTES="Rolling build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}.

          Not a stable release: rebuilt on every push to main. Select the
          **nightly** channel in your editor extension to use it."

          if gh release view nightly >/dev/null 2>&1; then
            # Upload first, then rename: a client that sees the new name can
            # always download the matching binaries.
            gh release upload nightly release/* --clobber
            gh release edit nightly \
              --title "$VERSION" \
              --notes "$NOTES" \
              --prerelease \
              --latest=false
          else
            gh release create nightly release/* \
              --title "$VERSION" \
              --notes "$NOTES" \
              --prerelease \
              --latest=false
          fi
